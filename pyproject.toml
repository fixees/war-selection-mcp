[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "war-selection-mcp"
version = "0.1.0"
description = "Local MCP server for War Selection Lua modding (cached mods, game data, API index, Russian guide)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.25,<2"]
authors = [{ name = "fixees" }]
keywords = ["mcp", "mcp-server", "war-selection", "modding", "lua", "rts"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Games/Entertainment :: Real Time Strategy",
]

[project.urls]
Homepage = "https://github.com/fixees/war-selection-mcp"
Issues = "https://github.com/fixees/war-selection-mcp/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
war-selection-mcp = "ws_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ws_mcp = ["data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
